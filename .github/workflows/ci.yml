name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
env:
  AULA_DISABLE_HARDWARE_WRITES: '1'
  CARGO_TERM_COLOR: always
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev libudev-dev libayatana-appindicator3-dev
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Select stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add clippy rustfmt
      - run: npm --prefix app ci
      - run: npm --prefix app test
      - run: npm --prefix app run build
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: python3 -m unittest discover -s tests -p 'test_publication.py'
      - run: python3 scripts/build-site.py
      - run: python3 scripts/check-publication.py
