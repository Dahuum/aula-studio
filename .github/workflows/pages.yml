name: Landing page
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build static page and source download
        env:
          PUBLIC_REPOSITORY: ${{ github.repository }}
          PUBLIC_OWNER: ${{ github.repository_owner }}
        run: python3 scripts/build-site.py --repository-url "https://github.com/${PUBLIC_REPOSITORY}" --site-url "https://${PUBLIC_OWNER}.github.io/${PUBLIC_REPOSITORY#*/}"
      - run: python3 scripts/check-publication.py
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site/dist
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
