name: Native desktop previews
on:
  workflow_dispatch:
  push:
    branches: [feature/cross-platform-desktop]
    paths:
      - app/**
      - crates/**
      - Cargo.*
      - third_party/**
      - scripts/package-desktop.py
      - scripts/native-platform-smoke.py
      - scripts/windows-installer-smoke.py
      - scripts/macos-installer-smoke.py
      - scripts/prepare-public-release.py
      - .github/workflows/native-desktop.yml
permissions:
  contents: read
env:
  AULA_DISABLE_HARDWARE_WRITES: '1'
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: '2'
  PYTHONUTF8: '1'
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            bundle: nsis
          - runner: macos-15
            target: aarch64-apple-darwin
            bundle: app,dmg
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            bundle: app,dmg
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
      CI: 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Restore native Rust build cache
        id: rust-cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: native-v2-${{ matrix.target }}-rust1931-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            native-v2-${{ matrix.target }}-rust1931-${{ hashFiles('Cargo.lock') }}-
            native-v1-${{ matrix.target }}-rust1931-${{ hashFiles('Cargo.lock') }}
      - name: Install release-tested Rust and target
        shell: bash
        run: |
          rustup toolchain install 1.93.1 --profile minimal
          rustup default 1.93.1
          rustup target add '${{ matrix.target }}'
          rustup component add clippy rustfmt
      - run: npm --prefix app ci
      - run: npm --prefix app test -- --maxWorkers=1 --no-file-parallelism
      - run: npm --prefix app run build
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo build --release --locked --target ${{ matrix.target }} -p aula-cli
      - run: python scripts/package-desktop.py prepare --target ${{ matrix.target }}
      - name: Build native installer
        working-directory: app
        run: npm run tauri build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundle }} --config ../dist/native-resources/tauri-native.json
      - name: Launch actual native GUI and CLI with isolated demo data
        shell: bash
        run: |
          if [[ '${{ runner.os }}' == Windows ]]; then
            app='target/${{ matrix.target }}/release/aula-studio.exe'
            cli='target/${{ matrix.target }}/release/aula.exe'
          else
            app='target/${{ matrix.target }}/release/bundle/macos/AULA Studio.app/Contents/MacOS/aula-studio'
            cli='target/${{ matrix.target }}/release/aula'
          fi
          python scripts/native-platform-smoke.py --binary "$app" --cli "$cli" --output dist/native-smoke
      - run: python scripts/package-desktop.py package --target ${{ matrix.target }}
      - name: Install, launch and uninstall our own Windows package
        if: runner.os == 'Windows'
        run: python scripts/windows-installer-smoke.py
      - name: Verify DMG and launch its copied application
        if: runner.os == 'macOS'
        run: python scripts/macos-installer-smoke.py --target ${{ matrix.target }}
      - name: Upload tested native packages and evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-${{ matrix.target }}
          path: |
            dist/native-desktop/*.exe
            dist/native-desktop/*.dmg
            dist/native-desktop/*.zip
            dist/native-desktop/*.gz
            dist/native-desktop/*-build.json
            dist/native-desktop/SHA256SUMS
            dist/native-smoke/*.json
            dist/native-smoke/*.log
            dist/windows-installer-smoke/result.json
            dist/windows-installer-smoke/launch/result.json
            dist/windows-installer-smoke/launch/app.log
            dist/macos-installer-smoke/result.json
            dist/macos-installer-smoke/launch/result.json
            dist/macos-installer-smoke/launch/app.log
          if-no-files-found: warn
          retention-days: 14
      - name: Retain reproducible native build cache
        if: always() && steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: native-v2-${{ matrix.target }}-rust1931-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
