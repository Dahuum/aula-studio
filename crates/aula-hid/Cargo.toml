[package]
name = "aula-hid"
version.workspace = true
edition.workspace = true
license.workspace = true
[dependencies]
aula-models = { path = "../aula-models" }
aula-protocol = { path = "../aula-protocol" }
serde.workspace = true
thiserror.workspace = true
hidapi = { version = "2.6", default-features = false }
aula-service = { path = "../aula-service" }

fs2 = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
hidapi = { version = "2.6", default-features = false, features = ["linux-static-hidraw"] }

[target.'cfg(target_os = "windows")'.dependencies]
hidapi = { version = "2.6", default-features = false, features = ["windows-native"] }
windows-sys = { version = "0.61", features = ["Win32_Devices_DeviceAndDriverInstallation", "Win32_Devices_Properties", "Win32_Foundation"] }

[target.'cfg(target_os = "macos")'.dependencies]
hidapi = { version = "2.6", default-features = false, features = ["macos-shared-device"] }
